name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contract:
    name: Local contract (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set isolated repository identity
        run: |
          git config --local user.name soraparkafterdark
          git config --local user.email sorapark@proton.me
      - name: Verify host-testable contract
        run: python3 tools/verify.py --profile local

  windows-plugin:
    name: Windows SKSE plugin (synthetic data)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the Visual Studio x64 compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Verify MSVC environment
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "Visual Studio C++ compiler is not available"
          }
      - name: Build Rust core DLL
        working-directory: core
        run: cargo build --release
      - name: Expose runner vcpkg to CMake preset
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
      - name: Restore vcpkg dependencies
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            plugin/build/vcpkg_installed
            C:\vcpkg\downloads
          key: windows-vcpkg-${{ hashFiles('plugin/vcpkg.json', 'plugin/vcpkg-configuration.json') }}
      - name: Configure SKSE plugin
        working-directory: plugin
        run: cmake --preset release
      - name: Save vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            plugin/build/vcpkg_installed
            C:\vcpkg\downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build SKSE plugin
        working-directory: plugin
        run: cmake --build --preset release
      - name: Upload non-release build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: skyring-windows-synthetic-${{ github.sha }}
          path: plugin/dist/SKSE/Plugins/
          if-no-files-found: error
          retention-days: 7
